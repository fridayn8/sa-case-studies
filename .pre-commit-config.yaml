# pre-commit — runs checks automatically before every `git commit`
#
# Setup (once per machine):
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type commit-msg   # enables commit message linting
#
# Usage:
#   pre-commit run --all-files
#   pre-commit autoupdate                       # bump hook versions

repos:
  # Generic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch       # blocks direct commits to main
        args: [--branch, main]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Markdown style
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint

  # Relative links and #anchors must resolve (whole repository, not only changed files)
  - repo: local
    hooks:
      - id: check-links
        name: Markdown links and anchors resolve
        entry: python3 scripts/check-links.py .
        language: system
        files: \.md$
        pass_filenames: false

  # Conventional Commits check on the commit message
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
